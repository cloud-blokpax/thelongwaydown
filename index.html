<style>
:root{--bg:#0d0e12;--panel:#15171f;--panel2:#1c1f2a;--ink:#e9e7de;--mut:#8b8879;--line:#2a2d3a;--sig:#f0b429;--danger:#ff5d5d;--live:#ff3b6b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-family:ui-serif,Georgia,"Iowan Old Style",serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:12px 0 8px}
.hudbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px}
.live{display:flex;align-items:center;gap:6px;color:var(--live);font-weight:700;letter-spacing:.08em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}

.spacer{flex:1}
.floorname{color:var(--sig);font-weight:700;letter-spacing:.03em}
.hpwrap{height:7px;background:#000;border-radius:99px;overflow:hidden;flex:1;min-width:64px;max-width:150px}
.hpfill{height:100%;background:linear-gradient(90deg,var(--danger),var(--sig));transition:width .4s}
.gold{color:var(--sig)}
.caption{margin:18px 0 6px;border-left:3px solid var(--sig);padding:10px 0 10px 14px;position:relative}
.captag{font-size:10px;letter-spacing:.14em;color:var(--sig);text-transform:uppercase;margin-bottom:6px}
.captext{font-family:ui-monospace,monospace;font-size:14.5px;color:#f4f2ea;line-height:1.6}
.scanline{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.012) 4px);border-radius:4px}
.enemy{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;display:flex;gap:12px}
.enemyhp{font-size:11px;color:var(--mut)}
.ehpwrap{height:6px;background:#000;border-radius:99px;overflow:hidden;margin-top:5px}
.ehpfill{height:100%;background:var(--danger);transition:width .3s}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.btn{appearance:none;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:14px 16px;font-family:inherit;font-size:15.5px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s;width:100%}
.btn:hover{border-color:var(--sig);background:#22252f}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4}
.btn .sub{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;font-family:ui-monospace,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;border:1px solid var(--sig);border-radius:12px;padding:11px 16px;max-width:520px;width:calc(100% - 32px);animation:rise .35s ease;z-index:20}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast .t{color:var(--sig);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.toast .l{font-size:13px;margin-top:3px;font-family:ui-monospace,monospace}
.title{text-align:center;padding:44px 0 8px}
.title h1{font-size:34px;letter-spacing:.02em;margin:0;line-height:1.05}
.title .sub{color:var(--mut);font-family:ui-monospace,monospace;font-size:12px;margin-top:10px;letter-spacing:.05em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.pick{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--sig);background:#20232d}
.opt.sel{border-color:var(--sig);background:#23262f}
.opt .n{font-weight:700}
.opt .b{font-size:12.5px;color:var(--mut);font-family:ui-monospace,monospace;margin-top:2px}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.stat{background:#000;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:ui-monospace,monospace;font-size:12px}
.stat b{color:var(--sig)}
.dead{text-align:center;padding:40px 0}
.dead h2{font-size:26px;color:var(--danger);margin:0 0 6px}
.small{font-size:12px;color:var(--mut);font-family:ui-monospace,monospace}
.row{display:flex;align-items:center;gap:8px}
.primary{background:var(--sig);color:#000;border:none;font-weight:800}
.primary:hover{background:#ffc94d}
@media (prefers-reduced-motion:reduce){.dot,.toast{animation:none}}
</style>
</head>

function makeRng(seed){var s=seed>>>0;return function(){s|=0;s=(s+0x6d2b79f5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashF(seed,n){var t=(seed^Math.imul(n,0x9E3779B9))>>>0;t=Math.imul(t^(t>>>16),0x21f0aaad);t=Math.imul(t^(t>>>15),0x735a2d97);t^=t>>>15;return(t>>>0)/4294967296;}
function draw(){return hashF(S.seed,S.rngStep++);}
function pick(rng,a){return a[Math.floor(rng()*a.length)];}
function rint(rng,a,b){return Math.floor(rng()*(b-a+1))+a;}
function weighted(rng,items,w){var tot=w.reduce(function(x,y){return x+y;},0),r=rng()*tot;for(var i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i];}return items[items.length-1];}
function rollTier(rng,floorTier){var t=weighted(rng,WORLD.config.lootTiers,WORLD.config.lootTierWeights);if(floorTier){var o=WORLD.config.lootTiers;if(o.indexOf(t)<o.indexOf(floorTier))t=floorTier;}return t;}
function tierMult(t){return 1+WORLD.config.lootTiers.indexOf(t)*0.5;}

function attack(){var p=S.player,e=enc(),mob=e._mob,wa=0;for(var k in p.equipment){var it=p.equipment[k];if(it&&it.atk)wa+=it.atk*(it._mult||1);}var dmg=Math.max(3,Math.round(effStat(p,"Brawn")+wa+draw()*5));var ne=S.enemyHp-dmg;if(ne<=0){var gold=rint(draw,mob.goldMin,mob.goldMax);S.enemyHp=0;addGold(p,gold);p.kills+=1;if(e.kind==="boss"){var item=Object.assign({},pick(draw,WORLD.loot),{tier:mob.tier,_mult:tierMult(mob.tier)});giveItem(p,item,false);}emit("enemyKilled",{isBoss:e.kind==="boss"});S.combatMsg="You drop "+mob.name+". +"+gold+" gold."+(e.kind==="boss"?" A boss box hits your bag.":"");spendTime(rint(draw,2,5));if(S.phase==="play"){advance();return;}render();}else{S.enemyHp=ne;var inc=Math.max(1,mob.atk+Math.floor(draw()*4)-Math.round(effStat(p,"Grit")/3));if(applyDamage(p,inc,true)){die(mob.name+" put you down for the cameras.");return;}S.combatMsg="You hit "+mob.name+" for "+dmg+". It claws back for "+inc+".";spendTime(1);render();}}

h+='<div class="choices">';
if(e.kind==="combat"||e.kind==="boss"){h+='<button class="btn" id="atk">Attack <span class="sub">Brawn + weapon</span></button><button class="btn" id="flee">Flee <span class="sub">Reflex check \u2014 costly if it fails</span></button>';}else if(e.kind==="event"){e.event.options.forEach(function(o){h+='<button class="btn ev" data-o="'+o.outcome+'">'+esc(o.label)+'</button>';});}else if(e.kind==="loot"){h+='<button class="btn" id="take">Take the '+e.tier+' '+e.item.name+' <span class="sub" style="color:'+TIER_COLOR[e.tier]+'">'+e.tier+' \u00b7 '+e.item.slot+'</span></button><button class="btn" id="leave">Leave it</button>';}else if(e.kind==="safe"){h+='<button class="btn" id="rest">Rest \u2014 recover HP <span class="sub">Costs 6h</span></button><button class="btn" id="move">Move on</button>';}else if(e.kind==="stairs"){var last=S.floorIdx+1>=WORLD.floors.length;h+='<button class="btn primary" id="desc">Take the stairs down <span class="sub" style="color:#5a4a10">'+(last?"Final descent":"To "+WORLD.floors[S.floorIdx+1].name)+'</span></button>';}
h+='</div>';root.innerHTML=h;
if(document.getElementById("atk"))document.getElementById("atk").onclick=function(){dispatch("attack");};
if(document.getElementById("flee"))document.getElementById("flee").onclick=function(){dispatch("flee");};
Array.prototype.forEach.call(document.querySelectorAll(".ev"),function(el){el.onclick=function(){dispatch("event",el.getAttribute("data-o"));};});
if(document.getElementById("take"))document.getElementById("take").onclick=function(){dispatch("take");};
if(document.getElementById("leave"))document.getElementById("leave").onclick=function(){dispatch("leave");};
if(document.getElementById("rest"))document.getElementById("rest").onclick=function(){dispatch("rest");};
if(document.getElementById("move"))document.getElementById("move").onclick=function(){dispatch("move");};
if(document.getElementById("desc"))document.getElementById("desc").onclick=function(){dispatch("descend");};
saveGame();
}
render();
</script>
</body>
</html>
